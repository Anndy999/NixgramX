name: Upstream Watch

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-upstream-sync
  cancel-in-progress: false

jobs:
  watch:
    if: github.repository == 'Anndy999/NixgramX' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    outputs:
      sha: ${{ steps.sync.outputs.sha }}
      pr: ${{ steps.sync.outputs.pr }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare Telegram version delta and draft PR
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/upstream_sync.py
      - name: Detection result
        if: always()
        env:
          RESULT: ${{ steps.sync.outcome }}
        run: |
          echo "Upstream detection/preparation: $RESULT. Failures remain visible; retry after correcting the reported problem. No auto merge or release." >> "$GITHUB_STEP_SUMMARY"
  # GITHUB_TOKEN PR creation does not fire pull_request workflows.
  # Explicitly build the exact prepared commit in this workflow instead.
  compile:
    needs: watch
    if: always() && needs.watch.outputs.sha != ''
    uses: ./.github/workflows/upstream-sync-ci.yml
    with:
      source_sha: ${{ needs.watch.outputs.sha }}
    permissions:
      contents: read
