name: Self-hosted debug build

on:
  workflow_dispatch:

jobs:
  build:
    name: Gradle Build (self-hosted)
    runs-on: [self-hosted, nixgramx]
    env:
      NATIVE_TARGET: "arm64-v8a"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive
      - name: Ensure local.properties
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_HOME:-}" ]; then
            SDK="$ANDROID_HOME"
          elif [ -n "${ANDROID_SDK_ROOT:-}" ]; then
            SDK="$ANDROID_SDK_ROOT"
          elif [ -d "$HOME/Android/Sdk" ]; then
            SDK="$HOME/Android/Sdk"
          elif [ -d "/opt/android-sdk" ]; then
            SDK="/opt/android-sdk"
          else
            echo "Android SDK not found. Install then export ANDROID_HOME." >&2
            echo "Suggested: /opt/android-sdk or ~/Android/Sdk" >&2
            exit 1
          fi
          echo "sdk.dir=${SDK}" > local.properties
          echo "Using SDK: ${SDK}"
          cat local.properties
      - name: Debug Build
        run: |
          set -euo pipefail
          export DEBUG_BUILD=true
          sed -i 's/signingConfig = signingConfigs.release//' TMessagesProj/build.gradle || true
          ./gradlew TMessagesProj:assembleDebug --no-daemon
          APK=$(find TMessagesProj/build/outputs/apk -name '*arm64-v8a*.apk' | head -1)
          test -n "$APK"
          echo "APK_DIR=$(dirname "$APK")" >> "$GITHUB_ENV"
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Debug-self-hosted
          path: ${{ env.APK_DIR }}
