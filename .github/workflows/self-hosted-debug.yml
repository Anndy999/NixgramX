name: Self-hosted debug build

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]
    paths-ignore:
      - '**.md'

jobs:
  build:
    name: Gradle Build (self-hosted)
    runs-on: [self-hosted, linux, nixgramx]
    env:
      NATIVE_TARGET: "arm64-v8a"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive
      - name: Ensure local.properties
        run: |
          if [ -n "${ANDROID_HOME:-}" ]; then
            echo "sdk.dir=${ANDROID_HOME}" > local.properties
          elif [ -n "${ANDROID_SDK_ROOT:-}" ]; then
            echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
          elif [ -d "$HOME/Android/Sdk" ]; then
            echo "sdk.dir=$HOME/Android/Sdk" > local.properties
          else
            echo "ANDROID_HOME / ANDROID_SDK_ROOT / ~/Android/Sdk not found" >&2
            exit 1
          fi
          cat local.properties
      - name: Debug Build
        run: |
          export DEBUG_BUILD=true
          sed -i 's/signingConfig = signingConfigs.release//' TMessagesProj/build.gradle || true
          ./gradlew TMessagesProj:assembleDebug --no-daemon
          APK=$(find TMessagesProj/build/outputs/apk -name '*arm64-v8a*.apk' | head -1)
          test -n "$APK"
          echo "APK_DIR=$(dirname "$APK")" >> "$GITHUB_ENV"
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Debug-self-hosted
          path: ${{ env.APK_DIR }}
