name: Full Verify

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git branch, tag, or SHA to verify (arm64-v8a Debug)'
        required: true
        type: string
        default: main

permissions:
  contents: read

jobs:
  full-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      COMMIT_ID: ${{ github.sha }}
      NATIVE_TARGET: arm64-v8a
      # Non-production compile-only placeholders, no repository secrets exposed.
      TELEGRAM_APP_ID: '123456'
      TELEGRAM_APP_HASH: '00000000000000000000000000000000'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive
          persist-credentials: false

      - name: Record checked-out commit
        run: |
          echo "COMMIT_ID=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "Building ref=${{ inputs.ref }} sha=$(git rev-parse HEAD)"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - uses: android-actions/setup-android@v4
        with:
          packages: 'build-tools;36.0.0 ndk;27.2.12479018 platforms;android-37.0 cmake;3.31.6'

      - name: YAML, regression and diff checks
        run: |
          python3 -m pip install 'PyYAML==6.0.2'
          python3 Tools/stability/static_checks.py
          python3 -m unittest discover -s Tools/stability -p 'test_*.py'
          mkdir -p /tmp/diagnostic-tests
          javac -d /tmp/diagnostic-tests TMessagesProj/src/main/java/org/telegram/messenger/diagnostics/DiagnosticStore.java Tools/stability/DiagnosticStoreTest.java
          java -cp /tmp/diagnostic-tests DiagnosticStoreTest
          git fetch origin main --depth=1
          git diff --check FETCH_HEAD HEAD

      - name: Prepare disposable Debug configuration
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes nasm
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          # Only this disposable CI checkout changes; release keystore is untouched.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('TMessagesProj/build.gradle')
          text = p.read_text()
          start = text.index('        debug {')
          end = text.index('        staging {', start)
          block = text[start:end]
          assert block.count('signingConfig = signingConfigs.release') == 1
          p.write_text(text[:start] + block.replace('signingConfig = signingConfigs.release', 'signingConfig = signingConfigs.debug') + text[end:])
          PY

      - name: Gradle config
        id: config
        run: ./gradlew help --no-daemon

      - name: Java/Kotlin compile
        id: compile
        run: ./gradlew :TMessagesProj:compileDebugSources --no-daemon

      - name: Resource merge
        id: resources
        run: ./gradlew :TMessagesProj:mergeDebugResources --no-daemon

      - name: Manifest merge
        id: manifest
        run: ./gradlew :TMessagesProj:processDebugMainManifest --no-daemon

      - name: Android lint
        id: lint
        run: ./gradlew :TMessagesProj:lintDebug --no-daemon

      - name: Native build
        id: native
        run: ./gradlew :TMessagesProj:externalNativeBuildDebug --no-daemon

      - name: arm64 Debug APK
        id: apk
        run: |
          set -euo pipefail
          ./gradlew :TMessagesProj:assembleDebug --no-daemon
          APK="$(find TMessagesProj/build/outputs/apk -name '*arm64-v8a*.apk' -print -quit)"
          test -n "$APK"
          mkdir -p /tmp/full-verify-apk
          cp "$APK" /tmp/full-verify-apk/
          echo "APK=$APK"

      - name: Upload arm64-v8a Debug APK
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: NixgramX-arm64-v8a-debug
          path: /tmp/full-verify-apk/*.apk
          if-no-files-found: error

      - name: Summary
        if: always()
        env:
          RESULTS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          steps = json.loads(os.environ['RESULTS'])

          def status(step_id):
              outcome = steps.get(step_id, {}).get('outcome')
              return {'success': 'PASS', 'failure': 'FAIL'}.get(outcome, 'FAIL')

          rows = [
              ('Gradle config', 'config'),
              ('Java/Kotlin compile', 'compile'),
              ('Resources', 'resources'),
              ('Manifest', 'manifest'),
              ('Full Android lint', 'lint'),
              ('Native', 'native'),
              ('APK build', 'apk'),
          ]
          ok = True
          lines = ['NixgramX Full Verify', '']
          for label, key in rows:
              value = status(key)
              ok &= value == 'PASS'
              lines.append(f'{label}: {value}')
          artifact = status('artifact')
          lines.append(f'Artifact upload: {artifact}')
          ok &= artifact == 'PASS'
          lines.extend([
              '',
              'Telegram publish: NOT RUN',
              'GitHub Release: NOT RUN',
              'Merge / version bump: NOT RUN',
              'Device test: NOT TESTED',
              '',
          ])
          summary = '\n'.join(lines)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(summary)
          print(summary)
          raise SystemExit(0 if ok else 1)
          PY
