name: Full Verify

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git branch, tag, or SHA to verify (arm64-v8a Debug)'
        required: true
        type: string
        default: main

permissions:
  contents: read

jobs:
  full-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      COMMIT_ID: ${{ github.sha }}
      NATIVE_TARGET: arm64-v8a
      TELEGRAM_APP_ID: ${{ secrets.TELEGRAM_APP_ID }}
      TELEGRAM_APP_HASH: ${{ secrets.TELEGRAM_APP_HASH }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive
          persist-credentials: false

      - name: Record checked-out commit
        run: |
          echo "COMMIT_ID=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "Building ref=${{ inputs.ref }} sha=$(git rev-parse HEAD)"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - uses: android-actions/setup-android@v4
        with:
          packages: 'build-tools;36.0.0 ndk;27.2.12479018 platforms;android-35 platforms;android-37.0 cmake;3.31.6'

      - name: YAML, regression and diff checks
        run: |
          python3 -m pip install 'PyYAML==6.0.2'
          python3 Tools/stability/static_checks.py
          python3 -m unittest discover -s Tools/stability -p 'test_*.py'
          mkdir -p /tmp/diagnostic-tests
          javac -d /tmp/diagnostic-tests \
            TMessagesProj/src/main/java/org/telegram/messenger/diagnostics/DiagnosticStore.java \
            TMessagesProj/src/main/java/org/telegram/messenger/diagnostics/NgxDiagnosticCore.java \
            TMessagesProj/src/main/java/org/telegram/messenger/diagnostics/NgxDiagnosticStore.java \
            TMessagesProj/src/main/java/org/telegram/messenger/diagnostics/NgxDiagnosticWriter.java \
            TMessagesProj/src/main/java/org/telegram/messenger/diagnostics/NgxDiagnosticExport.java \
            TMessagesProj/src/main/java/org/telegram/messenger/diagnostics/NgxDiagnosticSelfTest.java \
            Tools/stability/NgxDiagnosticCoreTest.java \
            Tools/stability/NgxDiagnosticInfrastructureTest.java \
            Tools/stability/DiagnosticStoreTest.java
          java -cp /tmp/diagnostic-tests DiagnosticStoreTest
          java -cp /tmp/diagnostic-tests NgxDiagnosticCoreTest
          java -cp /tmp/diagnostic-tests NgxDiagnosticInfrastructureTest
          git fetch origin main --depth=1
          git diff --check FETCH_HEAD HEAD

      - name: Prepare disposable Debug configuration
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes nasm
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          # CI-only: ignore official-upstream lint debt Nix must not "fix" in product
          # code (it would bloat the upstream diff). ThreadConstraint crashes
          # lintAnalyzeDebug; MissingPermission flags official runtime permission
          # guards that lint's cross-method analysis cannot trace.
          # Do not commit this into the product lint config.
          python3 - <<'PY'
          from pathlib import Path
          Path('TMessagesProj/lint.xml').write_text(
              '<?xml version="1.0" encoding="UTF-8"?>\n'
              '<lint>\n'
              '    <issue id="ThreadConstraint" severity="ignore" />\n'
              '    <issue id="MissingPermission" severity="ignore" />\n'
              '</lint>\n'
          )
          PY
          # Only this disposable CI checkout changes; release keystore is untouched.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('TMessagesProj/build.gradle')
          text = p.read_text()
          start = text.index('        debug {')
          end = text.index('        staging {', start)
          block = text[start:end]
          assert block.count('signingConfig = signingConfigs.release') == 1
          p.write_text(text[:start] + block.replace('signingConfig = signingConfigs.release', 'signingConfig = signingConfigs.debug') + text[end:])
          PY

      - name: Gradle config
        id: config
        run: ./gradlew help --no-daemon

      - name: Java/Kotlin compile
        id: compile
        run: ./gradlew :TMessagesProj:compileDebugSources --no-daemon

      - name: Resource merge
        id: resources
        run: ./gradlew :TMessagesProj:mergeDebugResources --no-daemon

      - name: Manifest merge
        id: manifest
        run: ./gradlew :TMessagesProj:processDebugMainManifest --no-daemon

      - name: Android lint
        id: lint
        # Report-only. Official Telegram ships ~416 pre-existing lint errors and
        # ~8900 warnings (e.g. RecyclerView position misuse in ChatActivity) that
        # Nix must not "fix" - patching upstream code would permanently bloat the
        # upstream diff. Lint still runs and its log stays available for reference,
        # but it no longer blocks the build. The compile / resource / manifest
        # gates above and the arm64 APK build below remain hard gates.
        continue-on-error: true
        run: ./gradlew :TMessagesProj:lintDebug --no-daemon

      - name: Native build
        id: native
        run: ./gradlew :TMessagesProj:externalNativeBuildDebug --no-daemon

      - name: arm64 Debug APK
        id: apk
        run: |
          set -euo pipefail
          ./gradlew :TMessagesProj:assembleDebug --no-daemon
          APK="$(find TMessagesProj/build/outputs/apk -name '*arm64-v8a*.apk' -print -quit)"
          test -n "$APK"
          python3 Tools/stability/verify_generated_apk_assets.py "$APK"
          mkdir -p /tmp/full-verify-apk
          cp "$APK" /tmp/full-verify-apk/
          echo "APK=$APK"

      - name: Upload arm64-v8a Debug APK
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: NixgramX-arm64-v8a-debug
          path: /tmp/full-verify-apk/*.apk
          if-no-files-found: error

      - name: Summary
        if: always()
        env:
          RESULTS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          steps = json.loads(os.environ['RESULTS'])

          def status(step_id):
              # Use conclusion: it respects continue-on-error, so the report-only
              # lint step reports PASS while real gate failures still report FAIL.
              conclusion = steps.get(step_id, {}).get('conclusion')
              return {'success': 'PASS', 'failure': 'FAIL'}.get(conclusion, 'FAIL')

          rows = [
              ('Gradle config', 'config'),
              ('Java/Kotlin compile', 'compile'),
              ('Resources', 'resources'),
              ('Manifest', 'manifest'),
              ('Full Android lint (report-only)', 'lint'),
              ('Native', 'native'),
              ('APK build', 'apk'),
          ]
          ok = True
          lines = ['NixgramX Full Verify', '']
          for label, key in rows:
              value = status(key)
              ok &= value == 'PASS'
              lines.append(f'{label}: {value}')
          artifact = status('artifact')
          lines.append(f'Artifact upload: {artifact}')
          ok &= artifact == 'PASS'
          if steps.get('lint', {}).get('outcome') == 'failure':
              lines.append('Lint: upstream debt reported (non-blocking; see job log)')
          lines.extend([
              '',
              'Telegram publish: NOT RUN',
              'GitHub Release: NOT RUN',
              'Merge / version bump: NOT RUN',
              'Device test: NOT TESTED',
              '',
          ])
          summary = '\n'.join(lines)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(summary)
          print(summary)
          raise SystemExit(0 if ok else 1)
          PY
