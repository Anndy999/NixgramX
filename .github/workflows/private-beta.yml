name: Private Beta Test

on:
  workflow_dispatch:
    inputs:
      recipient_certificate:
        description: Base64-encoded public CMS recipient certificate
        required: true
        type: string

permissions:
  contents: read

jobs:
  private-beta:
    name: Build encrypted private Beta arm64
    if: github.actor == github.repository_owner && github.ref_name == 'diagnostic/private-beta-13.2.2'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_HARDLINK: "true"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "10G"
      NATIVE_TARGET: arm64-v8a
      NIXGRAMX_CHANNEL: beta
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify source and run stability gates
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m pip install 'PyYAML==6.0.2'
          python3 Tools/stability/static_checks.py
          python3 -m unittest discover -s Tools/stability -p 'test_*.py'
      - uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          append-timestamp: false
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true
      - uses: actions/cache@v6
        with:
          path: ~/.gradle
          key: gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: |
            gradle-
      - uses: android-actions/setup-android@v4
        with:
          packages: 'build-tools;36.0.0 ndk;27.2.12479018 platforms;android-35 platforms;android-37.0 cmake;3.31.6'
      - name: Assemble signed Beta arm64 APK
        env:
          COMMIT_ID: ${{ github.sha }}
          TELEGRAM_APP_ID: ${{ secrets.TELEGRAM_APP_ID }}
          TELEGRAM_APP_HASH: ${{ secrets.TELEGRAM_APP_HASH }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes nasm
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          export BUILD_TIMESTAMP="$(date +%s)"
          if [ "$(awk '/MemTotal/ {print $2}' /proc/meminfo)" -ge 12582912 ]; then
            sed -i 's/^org\.gradle\.jvmargs=.*/org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=2G -XX:+UseParallelGC -Dfile.encoding=UTF-8/' gradle.properties
          fi
          ./gradlew TMessagesProj:assembleStaging
      - name: Verify APK and encrypt for delivery
        env:
          RECIPIENT_CERTIFICATE: ${{ inputs.recipient_certificate }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(TMessagesProj/build/outputs/apk/staging/*-arm64-v8a.apk)
          test "${#apks[@]}" -eq 1
          apk="${apks[0]}"
          python3 Tools/stability/verify_generated_apk_assets.py "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk"
          cert="$(mktemp)"
          trap 'rm -f "$cert"' EXIT
          printf '%s' "$RECIPIENT_CERTIFICATE" | base64 --decode > "$cert"
          openssl x509 -in "$cert" -noout -checkend 0
          openssl cms -encrypt -binary -aes-256-gcm -in "$apk" -outform DER -out "$RUNNER_TEMP/NixgramX-private-beta-arm64.apk.cms" "$cert"
      - name: Upload encrypted APK only
        uses: actions/upload-artifact@v7
        with:
          name: NixgramX-private-beta-encrypted
          path: ${{ runner.temp }}/NixgramX-private-beta-arm64.apk.cms
          retention-days: 1
          if-no-files-found: error
