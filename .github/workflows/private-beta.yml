name: Private Beta Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-beta:
    name: Build and deliver private Beta arm64
    if: github.actor == github.repository_owner && github.ref_name == 'diagnostic/private-beta-13.2.2'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_HARDLINK: "true"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "10G"
      NATIVE_TARGET: arm64-v8a
      NIXGRAMX_CHANNEL: beta
      NIXGRAMX_VERSION_CODE: '1359'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify source and run stability gates
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m pip install 'PyYAML==6.0.2'
          python3 Tools/stability/static_checks.py
          python3 -m unittest discover -s Tools/stability -p 'test_*.py'
      - uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          append-timestamp: false
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true
      - uses: actions/cache@v6
        with:
          path: ~/.gradle
          key: gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: |
            gradle-
      - uses: android-actions/setup-android@v4
        with:
          packages: 'build-tools;36.0.0 ndk;27.2.12479018 platforms;android-35 platforms;android-37.0 cmake;3.31.6'
      - name: Assemble signed Beta arm64 APK
        id: build
        env:
          COMMIT_ID: ${{ github.sha }}
          TELEGRAM_APP_ID: ${{ secrets.TELEGRAM_APP_ID }}
          TELEGRAM_APP_HASH: ${{ secrets.TELEGRAM_APP_HASH }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes nasm
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          export BUILD_TIMESTAMP="$(date +%s)"
          echo "timestamp=$BUILD_TIMESTAMP" >> "$GITHUB_OUTPUT"
          if [ "$(awk '/MemTotal/ {print $2}' /proc/meminfo)" -ge 12582912 ]; then
            sed -i 's/^org\.gradle\.jvmargs=.*/org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=2G -XX:+UseParallelGC -Dfile.encoding=UTF-8/' gradle.properties
          fi
          ./gradlew TMessagesProj:assembleStaging
      - name: Verify signed APK and startup assets
        id: apk
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(TMessagesProj/build/outputs/apk/staging/*-arm64-v8a.apk)
          test "${#apks[@]}" -eq 1
          PRIVATE_BETA_APK="${apks[0]}"
          python3 Tools/stability/verify_generated_apk_assets.py "$PRIVATE_BETA_APK"
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          signing_info="$("$build_tools/apksigner" verify --print-certs "$PRIVATE_BETA_APK")"
          printf '%s\n' "$signing_info" | grep -Fx 'Signer #1 certificate SHA-256 digest: 52548159979141626ee5b407b84ee70a3344ed91297f5fbe8e91df8f0c29a31c'
          apk_info="$("$build_tools/aapt" dump badging "$PRIVATE_BETA_APK")"
          printf '%s\n' "$apk_info" | grep -F "package: name='app.nixgramx.android' versionCode='$NIXGRAMX_VERSION_CODE' versionName='13.2.2-beta-${GITHUB_SHA:0:7}'"
          printf '%s\n' "$apk_info" | grep -Fx "native-code: 'arm64-v8a'"
          echo "path=$PRIVATE_BETA_APK" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Send APK to private Telegram test target
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
          HELPER_BOT_TOKEN: ${{ secrets.HELPER_BOT_TOKEN }}
          HELPER_BOT_PRIVATE_TARGET: ${{ secrets.HELPER_BOT_PRIVATE_TARGET }}
          HELPER_BOT_TARGET: ${{ secrets.HELPER_BOT_TARGET }}
          HELPER_BOT_CANARY_TARGET: ${{ secrets.HELPER_BOT_CANARY_TARGET }}
          COMMIT_ID: ${{ github.sha }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          BUILD_TIMESTAMP: ${{ steps.build.outputs.timestamp }}
          PRIVATE_BETA_APK: ${{ steps.apk.outputs.path }}
          RELEASE_NOTES: |
            - 书签和历史消息页面随视图生命周期清理玻璃效果监听与渲染资源。
            - 批量删除历史消息时分批查询媒体路径，并用事务删除消息和编辑记录。
            - 修正后备推送定时器的服务启动类型并清理旧定时器。
            - 修复输入框绘制异常时的状态恢复，并补录 Android 14+ 的替换文本诊断。
        run: |
          set -euo pipefail
          python -m pip install -r Tools/scripts/requirements.txt
          python Tools/scripts/upload_private_beta.py "$HELPER_BOT_TOKEN"
