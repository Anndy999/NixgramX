name: Pull request

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths-ignore:
      - '**.md'

permissions:
  contents: read

jobs:
  quick-verify:
    if: ${{ !startsWith(github.head_ref, 'upstream-sync/') }}
    uses: ./.github/workflows/quick-verify.yml
    # Reusable workflows do not receive repository secrets unless inherited.
    # Canary / Full Verify / Private Beta run as top-level jobs and can read
    # secrets.TELEGRAM_APP_* directly; this caller must pass them through.
    secrets: inherit
    with:
      source_sha: ${{ github.event.pull_request.head.sha }}
      base_sha: ${{ github.event.pull_request.base.sha }}
      base_ref: ${{ github.event.pull_request.base.ref }}
    secrets:
      TELEGRAM_APP_ID: ${{ secrets.TELEGRAM_APP_ID }}
      TELEGRAM_APP_HASH: ${{ secrets.TELEGRAM_APP_HASH }}
      LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}

  upstream-sync:
    if: ${{ startsWith(github.head_ref, 'upstream-sync/') }}
    uses: ./.github/workflows/upstream-sync-ci.yml
    secrets: inherit
    with:
      source_sha: ${{ github.event.pull_request.head.sha }}
