name: Pull request

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths-ignore:
      - '**.md'

permissions:
  contents: read

jobs:
  stability:
    if: ${{ !startsWith(github.head_ref, 'upstream-sync/') }}
    uses: ./.github/workflows/upstream-sync-ci.yml
    with:
      source_sha: ${{ github.event.pull_request.head.sha }}
