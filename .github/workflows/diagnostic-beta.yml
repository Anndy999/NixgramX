name: Diagnostic Beta APK

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: 'Diagnostic branch or SHA to build as a Beta Debug APK artifact'
        required: true
        type: string
        default: diagnostic/combined-header-photoviewer-1284

permissions:
  contents: read

jobs:
  diagnostic-beta:
    name: Diagnostic Beta Debug (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NATIVE_TARGET: arm64-v8a
      NIXGRAMX_CHANNEL: beta
      # This is an artifact-only diagnostic beta.  The source remains 1284;
      # 1285 marks this temporary artifact as newer than the 1284 baseline.
      NIXGRAMX_VERSION_CODE: '1285'
    steps:
      - uses: actions/checkout@v7
        with:
          # PR runs use the diagnostic head directly, never the synthetic
          # merge commit with main. Manual dispatch keeps the explicit input.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.ref }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Verify diagnostic source boundary
        run: |
          set -euo pipefail
          git fetch --no-tags origin beta diagnostic/channel-header-runtime-geometry
          git merge-base --is-ancestor 8e654a7605a2cbb3fca676a70e1253031793817d HEAD
          if git merge-base --is-ancestor 0041b0bc6e9b00ca4f9279a20847f3b53a45f18c HEAD; then
            echo 'Refuses to build: PR #46 is in the selected history.' >&2
            exit 1
          fi
          if git merge-base --is-ancestor 0a65a788376c30e5e7e60b2e82d3c9e5334f1fc9 HEAD; then
            echo 'Refuses to build: PR #47 is in the selected history.' >&2
            exit 1
          fi
          echo "COMMIT_ID=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "Building diagnostic source $(git rev-parse --short HEAD) as Beta version code ${NIXGRAMX_VERSION_CODE}"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - uses: android-actions/setup-android@v4
        with:
          packages: 'build-tools;36.0.0 ndk;27.2.12479018 platforms;android-37.0 cmake;3.31.6'

      - name: Prepare disposable diagnostic Beta Debug build
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes nasm
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          # pull_request jobs do not receive release-signing credentials. This
          # changes only the runner checkout to use Android's debug key.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('TMessagesProj/build.gradle')
          text = p.read_text()
          start = text.index('        debug {')
          end = text.index('        staging {', start)
          block = text[start:end]
          assert block.count('signingConfig = signingConfigs.release') == 1
          p.write_text(text[:start] + block.replace('signingConfig = signingConfigs.release', 'signingConfig = signingConfigs.debug') + text[end:])
          PY
          BUILD_TIMESTAMP=$(date +%s)
          echo "BUILD_TIMESTAMP=$BUILD_TIMESTAMP" >> "$GITHUB_ENV"

      - name: Build diagnostic Beta Debug APK
        run: ./gradlew :TMessagesProj:assembleDebug --no-daemon

      - name: Collect arm64-v8a APK
        run: |
          set -euo pipefail
          APK="$(find TMessagesProj/build/outputs/apk/debug -name '*-arm64-v8a.apk' -print -quit)"
          test -n "$APK"
          mkdir -p /tmp/diagnostic-beta-apk
          cp "$APK" /tmp/diagnostic-beta-apk/
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Upload diagnostic Beta APK
        uses: actions/upload-artifact@v7
        with:
          name: NixgramX-1285-diagnostic-beta-arm64-v8a
          path: /tmp/diagnostic-beta-apk/*.apk
          if-no-files-found: error

      - name: Summary
        run: |
          {
            echo 'NixgramX diagnostic Beta Debug APK created.'
            echo ''
            echo "Source commit: $COMMIT_ID"
            echo 'Base source: 8e654a7605a2cbb3fca676a70e1253031793817d (NixgramX 1284)'
            echo 'Artifact channel: beta; artifact version code: 1285'
            echo 'Signing: disposable Android debug key (not release-signable)'
            echo 'Full Android Lint: intentionally not run; it is blocked by baseline failures unrelated to this diagnostic.'
            echo 'GitHub Release: NOT RUN'
            echo 'Telegram publish: NOT RUN'
            echo 'Merge: NOT RUN'
          } >> "$GITHUB_STEP_SUMMARY"
