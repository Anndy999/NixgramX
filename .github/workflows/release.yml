name: Stable Release

on:
  push:
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish this verified Stable build to @NixgramX.'
        required: true
        type: boolean
        default: false
      release_notes:
        description: 'Optional public APK caption notes (multiline, one "- item" per line). Empty = version line only; never uses git commit title.'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Stable Gradle Build
    runs-on: ubuntu-latest
    outputs:
      build_timestamp: ${{ steps.release_build_step.outputs.build_timestamp }}
    env:
      NATIVE_TARGET: "arm64-v8a"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive
      - name: Verify stable source
        if: github.ref_type != 'tag' && github.ref_name != 'main'
        run: |
          echo "Stable releases must run from main or a v* tag."
          exit 1
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Set up Android SDK Tools
        uses: android-actions/setup-android@v4
        with:
          packages: "build-tools;36.0.0 ndk;27.2.12479018 platforms;android-37.0"
      - name: Install Native Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes nasm
      - name: Configure Android SDK Path
        run: |
          echo "sdk.dir=${ANDROID_HOME}" >> local.properties
      - name: Modify Gradle JVM Args
        run: |
          MEMORY_KB=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
          MEMORY_GB=$((MEMORY_KB / 1024 / 1024))
          echo "Detected memory size: ${MEMORY_GB}GB"
          if [ $MEMORY_GB -ge 12 ]; then
            sed -i '/^org\.gradle\.jvmargs=/d' gradle.properties
            echo "org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=2G -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> gradle.properties
          fi
          cat gradle.properties
      - name: Release Build
        id: release_build_step
        env:
          COMMIT_ID: ${{ github.sha }}
          NIXGRAMX_CHANNEL: stable
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
        run: |
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          export BUILD_TIMESTAMP=$(date +%s)
          echo "build_timestamp=$BUILD_TIMESTAMP" >> "$GITHUB_OUTPUT"
          ./gradlew TMessagesProj:assembleRelease
      - name: Upload arm64-v8a Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Stable-arm64-v8a
          path: TMessagesProj/build/outputs/apk/release/*-arm64-v8a.apk
      - name: Upload universal Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Stable-universal
          path: TMessagesProj/build/outputs/apk/release/*-universal.apk
  upload:
    name: Publish Stable
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    environment: stable
    needs:
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.12
      - name: Send to Telegram
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
          COMMIT_ID: ${{ github.sha }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'Stable release' }}
          BUILD_TIMESTAMP: ${{ needs.build.outputs.build_timestamp }}
          RELEASE_NOTES: ${{ github.event.inputs.release_notes || '' }}
          UPDATE_URL: https://t.me/NixgramX
        run: |
          python -m pip install -r Tools/scripts/requirements.txt
          export NIXGRAMX_VERSION_NAME="$(sed -n 's/^NIXGRAMX_VERSION_NAME=//p' gradle.properties | head -n1)"
          export NIXGRAMX_VERSION_CODE="$(sed -n 's/^NIXGRAMX_VERSION_CODE=//p' gradle.properties | head -n1)"
          export COMMIT_MESSAGE="$(git log -1 --format=%s HEAD)"
          # Quote secrets: unquoted @name / leading -id can confuse the shell.
          # Prefer numeric HELPER_BOT_TARGET (-100…) over @username (ResolveUsername flaky).
          python Tools/scripts/upload.py \
            "${{ secrets.HELPER_BOT_TOKEN }}" \
            "${{ secrets.HELPER_BOT_TARGET }}" \
            stable \
            "${{ secrets.HELPER_BOT_CANARY_TARGET }}"
