name: Beta Build

on:
  push:
    branches:
      - beta
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/staging.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish this Beta build to @NixgramX with a [BETA] label.'
        required: true
        type: boolean
        default: false
      release_notes:
        description: 'Optional changelog body for public APK caption.'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Beta Gradle Build
    runs-on: ubuntu-latest
    outputs:
      build_timestamp: ${{ steps.beta_build_step.outputs.build_timestamp }}
    steps:
      - name: Reuse existing 1284 timestamp
        id: beta_build_step
        run: echo "build_timestamp=1788771352" >> "$GITHUB_OUTPUT"
  upload:
    name: Publish Beta
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: d57401c30abf765f10c5863175cbb970d3eb8963
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: 34102991181
          path: artifacts
          pattern: Beta-*
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.12
      - name: Send to Telegram
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
          COMMIT_ID: d57401c30abf765f10c5863175cbb970d3eb8963
          COMMIT_URL: https://github.com/Anndy999/NixgramX/commit/d57401c30abf765f10c5863175cbb970d3eb8963
          COMMIT_MESSAGE: "release: prepare NixgramX 12.10.1 (1284) beta"
          BUILD_TIMESTAMP: ${{ needs.build.outputs.build_timestamp }}
          RELEASE_NOTES: ${{ github.event.inputs.release_notes || '' }}
        run: |
          python -m pip install -r Tools/scripts/requirements.txt
          python Tools/scripts/upload.py "${{ secrets.HELPER_BOT_TOKEN }}" "${{ secrets.HELPER_BOT_TARGET }}" beta "${{ secrets.HELPER_BOT_CANARY_TARGET }}"
