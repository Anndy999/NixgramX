name: Beta Build

on:
  push:
    branches:
      - beta
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/staging.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish this Beta build to @NixgramX with a [BETA] label.'
        required: true
        type: boolean
        default: false
      release_notes:
        description: 'Optional public APK caption notes (multiline, one "- item" per line). Empty = version line only; never uses git commit title.'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Beta Gradle Build
    runs-on: ubuntu-latest
    outputs:
      build_timestamp: ${{ steps.beta_build_step.outputs.build_timestamp }}
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_HARDLINK: "true"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "10G"
      NATIVE_TARGET: "universal"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive
      - name: Verify beta source
        if: github.event_name == 'workflow_dispatch' && github.ref_name != 'beta'
        run: |
          echo "Beta publishing must run from the beta branch."
          exit 1
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          append-timestamp: false
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true
      - name: Set up Gradle cache
        uses: actions/cache@v6
        with:
          path: ~/.gradle
          key: gradle-${{ hashFiles('**/*.gradle') }}
      - name: Set up Android SDK Tools
        uses: android-actions/setup-android@v4
        with:
          packages: "build-tools;36.0.0 ndk;27.2.12479018 platforms;android-37.0"
      - name: Install Native Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes nasm
      - name: Configure Android SDK Path
        run: |
          echo "sdk.dir=${ANDROID_HOME}" >> local.properties
      - name: Modify Gradle JVM Args
        run: |
          MEMORY_KB=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
          MEMORY_GB=$((MEMORY_KB / 1024 / 1024))
          echo "Detected memory size: ${MEMORY_GB}GB"
          if [ $MEMORY_GB -ge 12 ]; then
            sed -i '/^org\.gradle\.jvmargs=/d' gradle.properties
            echo "org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=2G -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> gradle.properties
          fi
          cat gradle.properties
      - name: Beta Build
        id: beta_build_step
        env:
          COMMIT_ID: ${{ github.sha }}
          NIXGRAMX_CHANNEL: beta
        run: |
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          export KEYSTORE_PASS="${{ secrets.KEYSTORE_PASS }}"
          export ALIAS_PASS="${{ secrets.ALIAS_PASS }}"
          export ALIAS_NAME="${{ secrets.ALIAS_NAME }}"
          export BUILD_TIMESTAMP=$(date +%s)
          echo "build_timestamp=$BUILD_TIMESTAMP" >> "$GITHUB_OUTPUT"
          ./gradlew TMessagesProj:assembleStaging
      - name: Upload arm64-v8a Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Beta-arm64-v8a
          path: TMessagesProj/build/outputs/apk/staging/*-arm64-v8a.apk
      - name: Upload universal Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Beta-universal
          path: TMessagesProj/build/outputs/apk/staging/*-universal.apk
  upload:
    name: Publish Beta
    concurrency:
      group: nixgramx-telegram-publish
      cancel-in-progress: false
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.12
      - name: Send to Telegram
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
          COMMIT_ID: ${{ github.sha }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'Beta release' }}
          BUILD_TIMESTAMP: ${{ needs.build.outputs.build_timestamp }}
          RELEASE_NOTES: ${{ github.event.inputs.release_notes || '' }}
          UPDATE_METADATA_MESSAGE_ID: ${{ vars.UPDATE_BETA_MESSAGE_ID }}
        run: |
          python -m pip install -r Tools/scripts/requirements.txt
          export COMMIT_MESSAGE="$(git log -1 --format=%s HEAD)"
          python Tools/scripts/upload.py "${{ secrets.HELPER_BOT_TOKEN }}" "${{ secrets.HELPER_BOT_TARGET }}" beta
