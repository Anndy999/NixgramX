name: Beta Build

on:
  push:
    branches:
      - beta
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/staging.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish this Beta build to @NixgramX with a [BETA] label.'
        required: true
        type: boolean
        default: false
      release_notes:
        description: 'Optional 「日志」 body for public APK caption (multiline, one "- item" per line). Empty falls back to docs/RELEASE_NOTES.txt then commit subject; rendered as NagramX Commit Message blockquote.'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  upload:
    name: Publish Beta
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 1284 commit for upload metadata
        uses: actions/checkout@v7
        with:
          ref: d57401c30abf765f10c5863175cbb970d3eb8963
          fetch-depth: 1
      - name: Download existing 1284 artifacts
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: '34102991181'
          path: artifacts
          pattern: Beta-*
      - name: Verify artifacts belong to 1284
        run: |
          set -euo pipefail
          find artifacts -type f -print
          python3 - <<'PY'
          from pathlib import Path
          apks = list(Path('artifacts').rglob('*.apk'))
          names = [p.name for p in apks]
          print('APKs:', names)
          assert apks, 'No APK artifacts downloaded'
          assert any('1284' in name and 'arm64-v8a' in name for name in names), names
          assert any('1284' in name and 'universal' in name for name in names), names
          PY
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Send to Telegram
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
          COMMIT_ID: d57401c30abf765f10c5863175cbb970d3eb8963
          COMMIT_URL: https://github.com/Anndy999/NixgramX/commit/d57401c30abf765f10c5863175cbb970d3eb8963
          COMMIT_MESSAGE: release: prepare NixgramX 12.10.1 (1284) beta
          BUILD_TIMESTAMP: '1788771352'
          RELEASE_NOTES: |
            - Version-only Beta test build
            - No functional changes
        run: |
          python -m pip install -r Tools/scripts/requirements.txt
          python Tools/scripts/upload.py "${{ secrets.HELPER_BOT_TOKEN }}" "${{ secrets.HELPER_BOT_TARGET }}" beta "${{ secrets.HELPER_BOT_CANARY_TARGET }}"
